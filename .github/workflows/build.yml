name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create and Build
        run: |
          rm -rf /tmp/app
          flutter create --project-name science --org com.sudan.science --platforms android /tmp/app
          cat > /tmp/app/lib/main.dart << 'ENDOFFILE'
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(debugShowCheckedModeBanner: false, home: HomePage()));
          class HomePage extends StatelessWidget {
            final List<Map<String,dynamic>> grades = [
              {"name":"الأول متوسط","color": Colors.teal, "icon": Icons.biotech},
              {"name":"الثاني متوسط","color": Colors.orange, "icon": Icons.favorite},
              {"name":"الثالث متوسط","color": Colors.indigo, "icon": Icons.rocket},
            ];
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('العلوم - متوسطة السودان'), backgroundColor: Colors.teal, centerTitle: true),
                body: Column(children: [
                  Container(width: double.infinity, padding: EdgeInsets.all(14), color: Color(0xFFE0F2F1), child: Text('🇸🇩 منهج السودان - مجاني لوجه الله - بدون نت', textAlign: TextAlign.center, style: TextStyle(fontWeight: FontWeight.bold))),
                  Expanded(child: ListView.builder(itemCount: grades.length, itemBuilder: (c,i) => Card(margin: EdgeInsets.all(12), child: ListTile(leading: CircleAvatar(backgroundColor: grades[i]['color'], child: Icon(grades[i]['icon'], color: Colors.white)), title: Text(grades[i]['name'], style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)), subtitle: Text('4 دروس مشروحة كاملة'), trailing: Icon(Icons.arrow_forward_ios), onTap: () => Navigator.push(c, MaterialPageRoute(builder: (_) => LessonsPage(grade: grades[i]['name']))))))),
                ]),
              );
            }
          }
          class LessonsPage extends StatelessWidget {
            final String grade;
            LessonsPage({required this.grade});
            final Map<String, List<Map<String,String>>> all = {
              "الأول متوسط": [
                {"t":"1- الخلية وحدة الحياة","c":"الخلية هي وحدة بناء الكائن الحي.\n\n• الخلية النباتية: جدار خلوي + بلاستيدات خضراء\n• الخلية الحيوانية: غشاء فقط\n\nأجزاؤها:\n- النواة: تتحكم في الخلية\n- السيتوبلازم: تحدث فيه التفاعلات\n- الغشاء: ينظم الدخول والخروج\n\nنراها بالمجهر الضوئي."},
                {"t":"2- تصنيف الكائنات","c":"التصنيف يسهل الدراسة.\n\nالممالك الخمس:\n1- بدائيات (بكتيريا)\n2- طلائعيات (أميبا)\n3- فطريات (عيش غراب)\n4- نباتات (تصنع غذائها)\n5- حيوانات (لا تصنع غذائها)\n\nالفيروسات ليست كائن حي كامل."},
                {"t":"3- المادة وخصائصها","c":"المادة لها كتلة وحجم.\n\nالحالات:\n• صلب: شكل وحجم ثابت\n• سائل: حجم ثابت\n• غاز: شكل وحجم متغير\n\nالتغير الفيزيائي: لا مادة جديدة (ثلج -> ماء)\nالتغير الكيميائي: مادة جديدة (خشب -> رماد)\n\nالكثافة = الكتلة ÷ الحجم"},
                {"t":"4- الطاقة","c":"الطاقة قدرة على بذل شغل.\n\nأنواعها: حركية، وضع، حرارية، ضوئية، كهربائية، كيميائية\n\nالقانون: الطاقة لا تفنى بل تتحول.\nمثال: بطارية (كيميائية) -> مصباح (ضوئية + حرارية)\n\nمتجددة: شمس، رياح\nغير متجددة: نفط، فحم"},
              ],
              "الثاني متوسط": [
                {"t":"1- أجهزة الجسم","c":"• هضمي: فم، مريء، معدة، أمعاء -> هضم\n• تنفسي: أنف، قصبة، رئتين -> تنفس\n• دوري: قلب، دم، أوعية -> نقل\n• عصبي: مخ، حبل شوكي -> تحكم\n• هيكلي: عظام -> دعم\n\nنحافظ عليها بغذاء صحي ورياضة."},
                {"t":"2- التكاثر","c":"لاجنسي: فرد واحد، لا تنوع (انقسام، تبرعم)\nجنسي: فردين، تنوع\n\nفي النبات: تلقيح -> إخصاب -> بذرة -> ثمرة\nفي الإنسان: إخصاب داخل الرحم، حمل
